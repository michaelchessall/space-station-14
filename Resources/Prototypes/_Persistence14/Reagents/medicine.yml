- type: reagent
  id: Acetaminophen
  name: reagent-name-acetaminophen
  group: Medicine
  desc: reagent-desc-acetaminophen
  physicalDesc: reagent-physical-desc-powdery
  flavor: medicine
  color: "#9c7938"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.01
      effects:
      - !type:Emote
        emote: Yawn
        probability: 0.1
      - !type:MovementSpeedModifier
        walkSpeedModifier: 0.65
        sprintSpeedModifier: 0.65

      - !type:ModifyStatusEffect
        effectProto: StatusEffectDrowsiness
        time: 1
        type: add
        conditions:
          - !type:ReagentCondition
            reagent: Acetaminophen
            min: 35
      - !type:HealthChange # Don't abuse painkillers kids
        conditions:
          - !type:ReagentCondition
            reagent: Acetaminophen
            min: 35
        damage:
          types:
            Poison: .1
            Asphyxiation: .8
      - !type:ModifyStatusEffect
        effectProto: StatusEffectSeeingRainbow
        type: add
        time: 15
        conditions:
        - !type:ReagentCondition
          reagent: Acetaminophen
          min: 25
      - !type:PopupMessage # we dont have sanity/mood so this will have to do
        type: Local
        visualType: Medium
        messages:
        - "painkiller-medicine-effect-painfree"
        - "painkiller-medicine-effect-drowsy"
        probability: 0.15
        conditions:
          - !type:DamageThreshold
            max: 15
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages:
        - "painkiller-medicine-effect-strength"
        - "painkiller-medicine-effect-drowsy"
        probability: 0.15
        conditions:
          - !type:DamageThreshold
            min: 16

