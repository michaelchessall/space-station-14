- type: entity
  parent:
  - AppearanceAvali
  - BaseSpeciesMobOrganic
  id: MobAvali
  name: Urist McSpaceRaptor
  components:
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#ccac1f"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: Speech
    speechSounds: Parrot
    speechVerb: Avali
    allowedEmotes: [ 'Chirp', 'Hisses', 'Purr', 'Growl', 'Scree', 'Call', 'Squawk', "Trill"]
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [Touch, Ingestion]
    reactions:
    - reagents: [Water, SpaceCleaner]
      methods: [Touch]
      effects:
      - !type:WashCreamPie
      - !type:Emote
        emote: Hisses
        showInChat: false

  - type: Vocal
    sounds:
      Male: MaleAvali
      Female: FemaleAvali
      Unsexed: MaleAvali
  - type: Damageable
    damageModifierSet: Avali
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    animation: WeaponArcClaw
    damage:
      types:
        Piercing: 2
        Slash: 3
  - type: Temperature
    specificHeat: 44
    currentTemperature: 220
  - type: ThermalRegulator
    # Ammonia boils at normal tempature
    implicitHeatRegulation: 100
    metabolismHeat: 300
    radiatedHeat: 1000
    sweatHeatRegulation: 200 # Avali aren't used to heat so they wouldn't sweat as much
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 220
  - type: MobThresholds # Small bird + Hollow bones means you have less health to work with
    thresholds:
      0: Alive
      80: SoftCritical
      130: HardCritical
      180: Dead
    stateAlertDict:
      Alive: HumanHealth
      SoftCritical: HumanCrit
      HardCritical: HumanCrit
      Dead: HumanDead
  - type: TemperatureDamage
    heatDamageThreshold: 280
    coldDamageThreshold: 200
    coldDamage:
      types:
        Cold: 0.05 # Per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat: 2.5 # Per second, scales with temperature & other constants
  - type: TemperatureProtection
    heatingCoefficient: 1.2
    coolingCoefficient: 3
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: AmmoniaBlood
        Quantity: 300

