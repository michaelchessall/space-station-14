- type: seed
  id: spacemansTrumpet
  name: seeds-spacemans-trumpet-name
  noun: seeds-noun-seeds
  displayName: seeds-spacemans-trumpet-display-name
  plantRsi: Objects/Specific/Hydroponics/spacemans_trumpet.rsi
  packetPrototype: SpacemansTrumpetSeeds
  productPrototypes:
  - FoodSpacemansTrumpet
  growthStages: 4
  lifespan: 20
  maturation: 14
  production: 3
  yield: 2
  chemicals:
    Nutriment:
      BaseAmount: 1
      Requirements:
        Water:
          Requirement: 1
        Fertilizer: # No CO2 requirement due to this being a space plant
          BonusRequirement: 0.4
          BonusAmount: 2
    PolypyryliumOligomers:
      BaseAmount: 5
      ModifyIdealPressure: -101 # Space plant
      ModifyIdealHeat: -150 # Able to survive space temperatures
      ModifyHeatTolerance: 150
      Requirements:
        Sugar:
          Requirement: 5
        Fertilizer:
          BonusRequirement: 2.5
          BonusAmount: 5
        Plasma:
          BonusRequirement: 2.5
          BonusAmount: 5

