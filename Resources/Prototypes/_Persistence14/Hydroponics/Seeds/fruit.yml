          BonusAmount: 1
    Gold: # Based vaguely off of my understanding of the magnum opus (process of creating philosopher's stone) from Wikipedia.
      BaseAmount: 10
      Requirements:
        Tin: # Base metal
          Requirement: 10
        Copper: # More expensive base metal.
          Requirement: 5
        Toxin: # Nigredo = Decomposition = Toxic
          Requirement: 2
        Acid: # Albedo = Washing away impurities. Making a nutrient that requires space cleaner seemed strange, so i used acid instead.
          Requirement: 2
        Hydrogen: # Citrinitas = Solar light inherent in ones being = Stars? = Hydrogen
          Requirement: 2
        Sapient: # Rubedo = Ego/self?
          Requirement: 2

