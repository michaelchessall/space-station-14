  production: 6
  yield: 3
  idealLight: 6
  chemicals:
    Nutriment:
      BaseAmount: 2
      Requirements:
        Water:
          Requirement: 2
        Fertilizer:
          BonusRequirement: 0.8
          BonusAmount: 4
        CarbonDioxide:
          BonusRequirement: 0.4
          BonusAmount: 4
    Vitamin:
      BaseAmount: 1
      Requirements:
        Nutrient:
          Requirement: 1
          BonusRequirement: 1
