# inspired by "Probably stolen" great game! made for Persistence 14

- type: entity 
  parent: [ DrinkBaseMaterialPlastic, DrinkBase, DrinkBaseOpenable, DrinkVisualsAll] #I wanna make it recyclable sooo not gonna use DrinkBottlePlasticSmallBaseFull
  id: BasePlasticBottle
  abstract: true
  components:
  - type: Openable
    sound:
      collection: bottleOpenSounds
    closeable: true
    closeSound:
      collection: bottleCloseSounds
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    inHandsMaxFillLevels: 3
  - type: Tag
    tags:
    - DrinkBottle
    - Recyclable
  - type: PhysicalComposition
    materialComposition:
      Plastic: 40

# tiny empty bottle

- type: entity 
  parent: BasePlasticBottle
  id: TinyPlasticBottle
  name: Tiny bottle
  description: A tiny plastic bottle for storing liquids.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Persistence14/Objects/Consumable/Drinks/waterbottles/tiny-plastic-bottle.rsi
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    inHandsMaxFillLevels: 3
  - type: PhysicalComposition
    materialComposition:
      Plastic: 45

