- type: entity
  parent: BaseWall
  id: WallShuttleTitanium
  name: titanium shuttle wall
  components:
  - type: Sprite
    sprite: _Persistence14/Structures/walls/titanium-shuttle-wall.rsi
    state: icon
  - type: Icon
    sprite: _Persistence14/Structures/walls/titanium-shuttle-wall.rsi
    state: icon
  - type: IconSmooth
    key: walls
    base: wall
  - type: Appearance
  - type: WallReplacementMarker
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: RadiationBlocker
    resistance: 5
  - type: Reflect
    reflectProb: 1
  - type: GenericVisualizer
    visuals:
      enum.ReinforcedWallVisuals.DeconstructionStage:
        ReinforcedWallVisualLayers.Deconstruction:
          -1: { visible: false }
          0: { state: construct-0, visible: true}
          1: { state: construct-1, visible: true}
          2: { state: construct-2, visible: true}
          3: { state: construct-3, visible: true}
          4: { state: construct-4, visible: true}
          5: { state: construct-5, visible: true}
  - type: Construction
    node: titaniumShuttleWall
    graph: Girder

- type: entity
  id: WallShuttleTitaniumDiagonal
  parent: WallDiagonalBase
  name: titanium shuttle wall
  suffix: Diagonal
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: _Persistence14/Structures/walls/titanium-shuttle-wall.rsi
    state: diagonal-0
  - type: Icon
    sprite: _Persistence14/Structures/walls/titanium-shuttle-wall.rsi
    state: diagonal-0
  - type: Construction
    graph: GirderDiagonal
    node: titaniumShuttleWallDiagonal
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: reinforcedGirder
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    mode: Diagonal
    key: walls
    base: diagonal-
    
- type: entity
  id: GrilleReinforcedFlimsy
  categories: [ HideSpawnMenu ]
  parent: BaseStructure
  name: reinforced grille
  description: A slightly less flimsy framework of titanium rods.
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: _Persistence14/Structures/walls/titanium-grille.rsi
    layers:
      - state: base
      - state: electrified
        sprite: Effects/electricity.rsi
        map: ["enum.ElectrifiedLayers.Sparks"]
        shader: unshaded
        visible: false
  - type: Icon
    sprite: _Persistence14/Structures/walls/titanium-grille.rsi
    state: base
  - type: MeleeSound
    soundGroups:
      Brute:
        path: "/Audio/Weapons/grille_hit.ogg"
  - type: CanBuildWindowOnTop
  - type: Construction
    node: flimsy
    graph: ReinforcedGrille
    defaultTarget: complete
    deconstructionTarget: start
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: PerforatedMetallic
  - type: Electrified
    requirePower: true
    noWindowInTile: true
    highVoltageNode: high
    mediumVoltageNode: medium
    lowVoltageNode: low
  - type: NodeContainer
    nodes:
      high: !type:CableDeviceNode
        nodeGroupID: HVPower
      medium: !type:CableDeviceNode
        nodeGroupID: MVPower
      low: !type:CableDeviceNode
        nodeGroupID: Apc
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - GlassLayer
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: broken
      - !type:DoActsBehavior
        acts: ["Breakage"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ElectrifiedVisuals.ShowSparks:
        enum.ElectrifiedLayers.Sparks:
          True: { visible: True }
          False: { visible: False }
  - type: AnimationPlayer

- type: entity
  id: GrilleReinforced
  parent: GrilleReinforcedFlimsy
  components:
  - type: Construction
    node: complete

- type: entity
  id: GrilleReinforcedDiagonalFlimsy
  categories: [ HideSpawnMenu ]
  parent: GrilleReinforced
  name: reinforced grille
  suffix: Diagonal
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: _Persistence14/Structures/walls/titanium-grille.rsi
    layers:
    - state: diagonal
    - state: electrified_diagonal
      sprite: Effects/electricity.rsi
      map: ["enum.ElectrifiedLayers.Sparks"]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: _Persistence14/Structures/walls/titanium-grille.rsi
    state: diagonal
  - type: Tag
    tags:
    - Diagonal
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Construction
    graph: ReinforcedGrilleDiagonal
    node: flimsy
    defaultTarget: complete
    deconstructionTarget: start

- type: entity
  id: GrilleReinforcedDiagonal
  parent: GrilleReinforcedDiagonalFlimsy
  components:
  - type: Construction
    node: complete

- type: entity
  id: GrilleReinforcedBroken
  parent: GrilleReinforced
  name: reinforced grille
  suffix: Broken
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: _Persistence14/Structures/walls/titanium-grille.rsi
    layers:
    - state: broken
  - type: Icon
    sprite: _Persistence14/Structures/walls/titanium-grille.rsi
    state: broken
  - type: Construction
    graph: ReinforcedGrilleDiagonal
    node: broken
    deconstructionTarget: start
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage", "Destruction"]