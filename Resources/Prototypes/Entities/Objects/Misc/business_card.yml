- type: entity
  id: SyndicateBusinessCard
  name: syndicate business card
  parent: [ Paper, BaseSyndicateContraband ]
  description: A black card with the syndicate's logo. There's something written on the back.
  components:
    - type: Sprite
      sprite: Objects/Misc/bureaucracy.rsi
      layers:
      - state: syndicate_card
      - state: syndicate_card
        map: ["enum.PaperVisualLayers.Writing"]
        visible: false
      - state: paper_stamp-generic
        map: ["enum.PaperVisualLayers.Stamp"]
        visible: false
    - type: Paper
      content: syndicate-business-card-base
    - type: PaperVisuals
      headerImagePath: "/Textures/Interface/Paper/paper_heading_syndicate_logo.svg.96dpi.png"
      headerMargin: 0.0, 0.0, 0.0, 2.0
      backgroundImagePath: "/Textures/Interface/Paper/paper_background_blood_red.svg.96dpi.png"
      backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
      contentMargin: 4.0, 4.0, 4.0, 4.0
      maxWritableArea: 400.0, 256.0

# Persistence: Blank business card
- type: entity
  id: BusinessCard
  name: business card
  parent: [ Paper ]
  description: A white business card. It's cut from thick & premium cardstock.
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: card_blank
    - state: card_written
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: Paper
  - type: PaperVisuals
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 4.0, 4.0, 4.0, 4.0
    maxWritableArea: 400.0, 256.0
