- type: constructionGraph
  id: medicineCabinet
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: medCabinet
          steps:
            - material: Steel
              amount: 4
              doAfter: 3

    - node: medCabinet
      entity: cabinetMed
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 4
          steps:
            - tool: Screwing
              doAfter: 4
